name: tree_ssh_plugin
description: SSH 执行器「中转站」插件（ssh_executor，binary 型内置插件）：一次 SSH 连接把随包 tree_agent 推到目标机并以一条常驻 exec 通道拉起它，此后所有 L1 请求转成 L2 JSON-RPC 走这一条通道。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  # SSH 客户端（纯 Dart）。**只用它的 exec 通道**：一次性命令（bootstrap）+ 一条常驻通道（agent）。
  # 刻意**不用** SFTP：稳态数据面全部走常驻通道的 JSON-RPC（协议 §0 的设计取舍）。
  dartssh2: ^4.1.0
  # 协议唯一真源（方法名 / 错误码 / 帧编解码 / 版本常量）。三端共用，禁止在插件里手写字符串。
  #
  # 为什么这里是 `../../packages/...`：本仓（tree-plugins）**装在桌面仓的 `plugins/` 下**，
  # 而这条 path 依赖把那个布局变成了**编译前提**（不只是构建便利）：单独 clone 本仓
  # 编不出这条插件（`dart pub get` 直接报路径不存在）。这不是意外，是取舍——
  # 「协议只住一处」比「本仓能独立编」更值钱，因为两边各抄一份帧形状的代价是
  # 装机后“某个请求突然不认”，而原因分在两个仓里。`tool/build_plugins.dart` 在未 clone
  # 时直接退 2，就是为了让这件事当场响。
  tree_tunnel_protocol:
    path: ../../packages/tree_tunnel_protocol

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
