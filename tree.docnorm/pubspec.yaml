name: tree_docnorm
description: tree.docnorm 插件的仓库扫描、契约侦查、注入计划、缺章节生成、包收束建议、基线落盘、分批提交、文档链接图、GraphRAG 索引、检索与关联边检查（DN-2/3/4/5/6/7/8/9/10）；不得反向依赖核心包。
publish_to: 'none'
version: 0.8.0

environment:
  sdk: ^3.13.0

dependencies:
  path: ^1.9.0
  yaml: ^3.1.2
  yograph: ^0.5.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
