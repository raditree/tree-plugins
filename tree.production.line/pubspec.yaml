name: tree_production_line
description: tree.production.line 插件：P1 数据模型与队列（line.yaml / task.yaml / runs / state.json，状态机 + 崩溃恢复）+ P3 准备阶段（需求模板 / 侦查 / 追问 / 范围与拆任务 / 落档）+ P4 打包执行 + P5 专家工具（ask_expert / 次数上限 / 只读 / 台账）+ P6 项目整理（只读审计报告 + 报告缓存 / stat 比对 / 增量重扫）+ P6+ 逻辑去重（函数级分块 / embedding / 全库 top-k，缓存落 tree.storage）；不得反向依赖核心包。
publish_to: 'none'
version: 0.11.1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
